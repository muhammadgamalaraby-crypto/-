<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أسئلة QR</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#05060f; --text:#f1f3ff; --muted:#8f97b8; --line:rgba(140,150,255,.18); --blue:#4aa8ff; --violet:#8b6cff; --cyan:#3be3ff; --good:#4cd58a; --bad:#ff7b8a; }
  * { box-sizing:border-box; }
  html { background:var(--bg); }
  body { margin:0; min-height:100vh; color:var(--text); line-height:1.7; font-family:"Cairo",system-ui,"Segoe UI",Tahoma,sans-serif;
         background:
           radial-gradient(60vw 50vh at 100% -5%, rgba(139,108,255,.38), transparent 70%),
           radial-gradient(50vw 45vh at -5% 105%, rgba(74,168,255,.28), transparent 70%),
           radial-gradient(40vw 40vh at 50% 120%, rgba(139,108,255,.18), transparent 70%),
           var(--bg);
         background-attachment:fixed; }
  .wrap { max-width:780px; margin:0 auto; padding:22px 18px 50px; }
  .center { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:18px; }
  .card { position:relative; background:linear-gradient(160deg, rgba(255,255,255,.07), rgba(255,255,255,.02));
          border:1px solid var(--line); border-radius:22px; padding:22px; margin-bottom:18px;
          backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
          box-shadow:0 10px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06); }
  .narrow { max-width:430px; width:100%; margin:0; }
  h1 { font-size:1.5rem; margin:0 0 14px; line-height:1.5; font-weight:700; }
  h2 { font-size:1.05rem; margin:0 0 12px; font-weight:600; }
  .grad { background:linear-gradient(90deg,var(--blue),var(--violet)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .eyebrow { font-size:.72rem; letter-spacing:.28em; color:var(--muted); text-transform:uppercase; margin-bottom:6px; direction:ltr; text-align:right; }
  label { display:block; font-size:.88rem; margin:14px 0 5px; color:var(--muted); }
  input, textarea { width:100%; padding:13px 14px; font:inherit; color:var(--text); background:rgba(255,255,255,.04);
                    border:1px solid var(--line); border-radius:12px; }
  input:focus, textarea:focus { outline:none; border-color:var(--blue); box-shadow:0 0 0 3px rgba(74,168,255,.18); }
  textarea { min-height:100px; resize:vertical; }
  button { font:inherit; font-weight:600; cursor:pointer; border:0; border-radius:999px; padding:11px 22px; background:#fff; color:#0a0c1a; transition:.15s; }
  button:hover { box-shadow:0 0 22px rgba(139,108,255,.55); transform:translateY(-1px); }
  button.ghost { background:rgba(255,255,255,.04); color:var(--text); border:1px solid var(--line); }
  button.ghost:hover { border-color:var(--cyan); box-shadow:0 0 18px rgba(59,227,255,.3); }
  button.danger { background:transparent; color:var(--bad); border:1px solid rgba(255,123,138,.5); }
  button:disabled { opacity:.5; cursor:default; transform:none; box-shadow:none; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .between { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .muted { color:var(--muted); font-size:.88rem; }
  .err { color:var(--bad); margin-top:10px; font-weight:600; }
  .ok { color:var(--good); font-weight:600; }
  .q { border-top:1px solid var(--line); padding:16px 0; }
  .q:first-child { border-top:0; }
  .q .t { font-weight:600; font-size:1.05rem; margin-bottom:4px; }
  .bar { margin:14px 0; }
  .bar .lbl { display:flex; justify-content:space-between; gap:10px; }
  .bar .track { height:10px; background:rgba(255,255,255,.07); border-radius:8px; overflow:hidden; margin-top:6px; }
  .bar .fill { height:100%; border-radius:8px; background:linear-gradient(90deg,var(--cyan),var(--blue),var(--violet)); box-shadow:0 0 14px rgba(74,168,255,.6); }
  .tbl { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:.92rem; }
  th, td { text-align:right; padding:10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:600; white-space:nowrap; }
  .modal { position:fixed; inset:0; background:rgba(3,4,12,.75); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; padding:18px; z-index:10; }
  .modal[hidden] { display:none; }
  .modal .box { background:linear-gradient(160deg, rgba(40,44,90,.9), rgba(14,16,36,.95)); border:1px solid var(--line); border-radius:24px;
                padding:24px; max-width:390px; width:100%; text-align:center; box-shadow:0 0 60px rgba(139,108,255,.35); }
  #qrbox { display:inline-block; background:#fff; padding:14px; border-radius:16px; margin:12px 0; box-shadow:0 0 30px rgba(74,168,255,.45); }
  .link { word-break:break-all; direction:ltr; font-size:.8rem; color:var(--muted); }
  .big { text-align:center; }
  .big h1 { line-height:1.7; }
</style>
</head>
<body>
<div id="app"></div>

<div class="modal" id="modal" hidden>
  <div class="box">
    <h2 id="mtitle"></h2>
    <div id="qrbox"></div>
    <div class="link" id="mlink"></div>
    <div class="row" style="justify-content:center; margin-top:14px">
      <button id="mdl">تحميل الصورة</button>
      <button class="ghost" id="mcopy">نسخ الرابط</button>
      <button class="ghost" id="mclose">إغلاق</button>
    </div>
  </div>
</div>

<script>
  // ============ الإعدادات ============
  // الصق هنا رابط Apps Script (اللي بينتهي بـ /exec)
  const API = "https://script.google.com/macros/s/AKfycbwPrXaLj3WR8CrT8aAfOt0Yea_sPT4vHk9n_xiMzG4s0tzlUzgiTRqOT4G5XX4ZW67s/exec";
  // ===================================

  const $ = (s) => document.querySelector(s);
  const app = $("#app");
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
  const fmt = (t) => { const d = new Date(t); return isNaN(d) ? "" : d.toLocaleString("ar-EG"); };

  async function api(action, data) {
    try {
      const r = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(Object.assign({ action }, data || {}))
      });
      return await r.json();
    } catch (e) {
      return { error: "network" };
    }
  }

  const qid = new URLSearchParams(location.search).get("q");

  /* ================= صفحة اللي بيمسح الـ QR ================= */
  function msg(title, text, bad) {
    app.innerHTML = '<div class="center"><div class="card narrow big"><h1 class="' + (bad ? "err" : "ok") + '">' + esc(title) + "</h1>" +
      (text ? '<p class="muted">' + esc(text) + "</p>" : "") + "</div></div>";
  }

  async function respondent(id) {
    let dev = null;
    try {
      dev = localStorage.getItem("device_id");
      if (!dev) {
        dev = "d" + ((window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(36).slice(2));
        localStorage.setItem("device_id", dev);
      }
    } catch (e) { dev = null; }
    if (!dev) return msg("المتصفح مانع التخزين", "اقفل وضع التصفح الخاص وجرّب تاني.", true);

    const flag = "opened_" + id;
    if (localStorage.getItem(flag)) return msg("الرابط ده اتفتح قبل كده على الجهاز ده", "مينفعش يتفتح تاني.", true);

    app.innerHTML = '<div class="center"><div class="muted">جاري التحميل...</div></div>';
    const r = await api("open", { qid: id, deviceId: dev });
    if (r.error === "used") { try { localStorage.setItem(flag, "1"); } catch (e) {} return msg("الرابط ده اتفتح قبل كده على الجهاز ده", "مينفعش يتفتح تاني.", true); }
    if (r.error === "notfound") return msg("السؤال مش موجود", "يمكن اتحذف أو الرابط غلط.", true);
    if (!r.ok) return msg("حصلت مشكلة في الاتصال", "جرّب تاني بعد شوية.", true);
    try { localStorage.setItem(flag, "1"); } catch (e) {}

    app.innerHTML =
      '<div class="center"><div class="card narrow">' +
      '<div class="eyebrow">Question</div><h1 id="qt"></h1>' +
      '<label>الاسم (إجباري)</label><input id="nm" maxlength="80" autocomplete="name">' +
      '<label>الكلية (اختياري)</label><input id="cl" maxlength="80">' +
      '<label>إجابتك</label><textarea id="an" maxlength="500"></textarea>' +
      '<div class="err" id="er"></div>' +
      '<button id="go" style="width:100%; margin-top:14px">إرسال</button>' +
      '<p class="muted">الصفحة دي بتتفتح مرة واحدة بس على الجهاز.</p>' +
      "</div></div>";
    $("#qt").textContent = r.question;

    $("#go").onclick = async () => {
      const name = $("#nm").value.trim(), answer = $("#an").value.trim();
      if (!name) { $("#er").textContent = "اكتب اسمك الأول."; return; }
      if (!answer) { $("#er").textContent = "اكتب إجابتك."; return; }
      $("#go").disabled = true; $("#er").textContent = "";
      const s = await api("submit", { qid: id, deviceId: dev, name, college: $("#cl").value.trim(), answer });
      if (s.ok) return msg("تم تسجيل إجابتك ✅", "شكراً ليك.", false);
      $("#go").disabled = false;
      $("#er").textContent = s.error === "used" ? "الجهاز ده جاوب قبل كده." : "حصلت مشكلة، جرّب تاني.";
    };
  }

  /* ================= صفحة الأدمن ================= */
  let token = sessionStorage.getItem("tok") || "";
  let timer = null;

  function logout() { sessionStorage.removeItem("tok"); token = ""; clearInterval(timer); loginView(); }
  async function aapi(action, data) {
    const r = await api(action, Object.assign({ token }, data || {}));
    if (r.error === "auth") { logout(); }
    return r;
  }
  function admin() { token ? dash() : loginView(); }

  function loginView() {
    app.innerHTML =
      '<div class="center"><div class="card narrow">' +
      '<div class="eyebrow">Admin</div><h1>تسجيل <span class="grad">الدخول</span></h1>' +
      '<label>اليوزر</label><input id="u" autocomplete="username">' +
      '<label>الباسورد</label><input id="p" type="password" autocomplete="current-password">' +
      '<div class="err" id="er"></div>' +
      '<button id="go" style="width:100%; margin-top:14px">دخول</button>' +
      "</div></div>";
    const go = async () => {
      $("#go").disabled = true; $("#er").textContent = "";
      const r = await api("login", { user: $("#u").value, pass: $("#p").value });
      if (r.ok) { token = r.token; sessionStorage.setItem("tok", token); dash(); return; }
      $("#go").disabled = false;
      $("#er").textContent = r.error === "network" ? "مشكلة في الاتصال بالسيرفر." : "اليوزر أو الباسورد غلط.";
    };
    $("#go").onclick = go;
    $("#p").onkeydown = (e) => { if (e.key === "Enter") go(); };
  }

  function dash() {
    clearInterval(timer);
    app.innerHTML =
      '<div class="wrap">' +
      '<div class="between" style="margin-bottom:14px"><div><div class="eyebrow" style="margin:0">QR Quiz</div><h1 style="margin:0">لوحة <span class="grad">التحكم</span></h1></div><button class="ghost" id="lo">خروج</button></div>' +
      '<div class="card"><h2>سؤال جديد</h2>' +
      '<textarea id="nq" maxlength="500" placeholder="اكتب السؤال هنا"></textarea>' +
      '<div class="err" id="er"></div>' +
      '<button id="mk" style="margin-top:12px">إنشاء QR</button></div>' +
      '<div class="card"><div class="between"><h2 style="margin:0">الأسئلة</h2><button class="ghost" id="rf">تحديث</button></div>' +
      '<div id="list" class="muted" style="margin-top:10px">جاري التحميل...</div></div>' +
      "</div>";
    $("#lo").onclick = logout;
    $("#rf").onclick = loadList;
    $("#mk").onclick = async () => {
      const text = $("#nq").value.trim();
      if (!text) { $("#er").textContent = "اكتب السؤال الأول."; return; }
      $("#mk").disabled = true; $("#er").textContent = "";
      const r = await aapi("create", { text });
      $("#mk").disabled = false;
      if (!r.ok) { $("#er").textContent = "حصلت مشكلة، جرّب تاني."; return; }
      $("#nq").value = "";
      showQR(r.id, r.text);
      loadList();
    };
    loadList();
  }

  async function loadList() {
    const r = await aapi("list");
    const box = $("#list");
    if (!box) return;
    if (!r.ok) { box.textContent = "مشكلة في تحميل الأسئلة."; return; }
    if (!r.questions.length) { box.textContent = "مفيش أسئلة لسه."; return; }
    box.innerHTML = "";
    r.questions.forEach((q) => {
      const d = document.createElement("div");
      d.className = "q";
      d.innerHTML = '<div class="t"></div><div class="muted">فتحوا: ' + q.opens + " — جاوبوا: " + q.answers + " — " + esc(fmt(q.createdAt)) + '</div>' +
        '<div class="row" style="margin-top:8px"><button class="b-r">النتائج</button><button class="ghost b-q">عرض QR</button><button class="danger b-d">حذف</button></div>';
      d.querySelector(".t").textContent = q.text;
      d.querySelector(".b-r").onclick = () => results(q.id);
      d.querySelector(".b-q").onclick = () => showQR(q.id, q.text);
      d.querySelector(".b-d").onclick = async () => {
        if (!confirm("متأكد إنك عايز تحذف السؤال ده؟")) return;
        await aapi("delete", { qid: q.id });
        loadList();
      };
      box.appendChild(d);
    });
  }

  /* ---- QR ---- */
  function linkFor(id) { return location.origin + location.pathname + "?q=" + encodeURIComponent(id); }

  function showQR(id, text) {
    const link = linkFor(id);
    $("#mtitle").textContent = text;
    $("#mlink").textContent = link;
    const qb = $("#qrbox");
    qb.innerHTML = "";
    new QRCode(qb, { text: link, width: 240, height: 240, correctLevel: QRCode.CorrectLevel.M });
    $("#modal").hidden = false;
    $("#mclose").onclick = () => { $("#modal").hidden = true; };
    $("#mcopy").onclick = async () => {
      try { await navigator.clipboard.writeText(link); $("#mcopy").textContent = "تم النسخ ✅"; setTimeout(() => $("#mcopy").textContent = "نسخ الرابط", 1500); } catch (e) {}
    };
    $("#mdl").onclick = () => {
      const c = qb.querySelector("canvas");
      const src = c ? c.toDataURL("image/png") : qb.querySelector("img").src;
      const a = document.createElement("a");
      a.href = src; a.download = "qr-" + id + ".png"; a.click();
    };
  }

  /* ---- النتائج ---- */
  function tally(rows) {
    const m = new Map();
    rows.forEach((r) => {
      const clean = r.answer.trim().replace(/\s+/g, " ");
      const k = clean.toLowerCase();
      const o = m.get(k) || { text: clean, n: 0 };
      o.n++; m.set(k, o);
    });
    return [...m.values()].sort((a, b) => b.n - a.n);
  }

  async function results(id) {
    clearInterval(timer);
    app.innerHTML = '<div class="wrap"><div class="between" style="margin-bottom:14px"><button class="ghost" id="bk">← رجوع</button><button class="ghost" id="rf">تحديث</button></div><div id="res" class="muted">جاري التحميل...</div></div>';
    $("#bk").onclick = dash;
    const draw = async () => {
      const r = await aapi("results", { qid: id });
      const box = $("#res");
      if (!box) { clearInterval(timer); return; }
      if (!r.ok) { box.textContent = "مشكلة في تحميل النتائج."; return; }
      const t = tally(r.answers), total = r.answers.length;
      let h = '<div class="card"><div class="muted">السؤال</div><h1 id="qt" style="margin:4px 0 6px"></h1>' +
        '<div class="muted">فتحوا: ' + r.opens + " — جاوبوا: " + total + '</div>' +
        '<div class="row" style="margin-top:10px"><button class="ghost" id="qr">عرض QR</button></div></div>';
      h += '<div class="card"><h2>عدد الأصوات لكل إجابة</h2>';
      if (!t.length) h += '<div class="muted">لسه مفيش إجابات.</div>';
      t.forEach((x) => {
        const pct = Math.round((x.n / total) * 100);
        h += '<div class="bar"><div class="lbl"><span>' + esc(x.text) + "</span><b>" + x.n + " (" + pct + '%)</b></div><div class="track"><div class="fill" style="width:' + pct + '%"></div></div></div>';
      });
      h += "</div>";
      h += '<div class="card"><h2>كل الإجابات</h2><div class="tbl"><table><thead><tr><th>الاسم</th><th>الكلية</th><th>الإجابة</th><th>الوقت</th></tr></thead><tbody>';
      r.answers.slice().reverse().forEach((a) => {
        h += "<tr><td>" + esc(a.name) + "</td><td>" + (a.college ? esc(a.college) : "—") + "</td><td>" + esc(a.answer) + "</td><td>" + esc(fmt(a.time)) + "</td></tr>";
      });
      h += "</tbody></table></div></div>";
      box.className = "";
      box.innerHTML = h;
      $("#qt").textContent = r.question.text;
      $("#qr").onclick = () => showQR(r.question.id, r.question.text);
    };
    $("#rf").onclick = draw;
    await draw();
    timer = setInterval(draw, 10000);
  }
  // تشغيل الصفحة (لازم يكون في الآخر)
  qid ? respondent(qid) : admin();
</script>
</body>
</html>
